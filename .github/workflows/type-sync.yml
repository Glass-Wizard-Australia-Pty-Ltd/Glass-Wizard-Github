name: Cross-Repo TypeScript Type Sync

on:
  push:
    branches:
      - main
    paths:
      - 'src/types/**/*.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install || true # ignore errors if there's no package.json

      - name: Run type sync script
        run: |
          node ./scripts/type-sync.js
